# ==============================================================================
# 🛡️ HARDENED NGINX CONFIGURATION FOR NODE.JS REVERSE PROXY
# ==============================================================================
# ضع هذا الملف في: /etc/nginx/sites-available/your-domain.conf
# ثم قم بتفعيله: ln -s /etc/nginx/sites-available/your-domain.conf /etc/nginx/sites-enabled/
# ولا تنسَ فحص الإعدادات بـ: nginx -t

server {
    # --------------------------------------------------------------------------
    # 1. إعدادات السيرفر والمنافذ (Ports & Domain)
    # --------------------------------------------------------------------------
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # --------------------------------------------------------------------------
    # 2. إعدادات شهادات SSL (Let's Encrypt مثال)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # --------------------------------------------------------------------------
    # 3. إعدادات TLS 1.3 فقط لأقصى درجات الأمان
    # --------------------------------------------------------------------------
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off; # في TLS 1.3 ترتيب الخوارزميات يُترك للعميل ضمن المعايير الآمنة

    # إعدادات جلسة SSL
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m; # 10MB تسع لحوالي 40000 جلسة
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # 4. تفعيل OCSP Stapling (لمنع المتصفح من التحقق من CA وتسريع الاتصال)
    # --------------------------------------------------------------------------
    ssl_stapling on;
    ssl_stapling_verify on;
    # مسار شهادة الـ Root/Intermediate لعمل Verify للـ OCSP (تأتي مع Let's Encrypt)
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s; # استخدام Cloudflare و Google كـ DNS
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # 5. Security Headers (رؤوس الأمان للمتصفح)
    # --------------------------------------------------------------------------
    
    # HSTS: إجبار المتصفحات على استخدام HTTPS دائماً لمدة سنة
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # منع تأطير الموقع (Clickjacking Protection)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # منع تخمين نوع الملفات (MIME Sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # حماية من بعض هجمات XSS في المتصفحات القديمة
    add_header X-XSS-Protection "1; mode=block" always;

    # سياسة الـ Referrer (حماية خصوصية الروابط الخارجة من موقعك)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 🛡️ Content Security Policy (CSP)
    # - يسمح بسكربتات موقعك فقط، ويمنع الـ Inline Scripts لتفادي XSS.
    # - ملاحظة: غيّر الإعدادات لتناسب احتياجات الـ Frontend الخاص بك (مثل السماح لـ Google Analytics).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://yourdomain.com; object-src 'none'; frame-ancestors 'none';" always;

    # منع استخدام ميزات المتصفح غير المصرح بها (الكاميرا، الميكروفون، الموقع)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --------------------------------------------------------------------------
    # 6. إعدادات الـ Reverse Proxy لتمرير الطلبات إلى Node.js
    # --------------------------------------------------------------------------
    location / {
        # تمرير الطلب لـ Node.js الذي يعمل على بورت 5000 (مثلاً)
        proxy_pass http://127.0.0.1:5000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # تمرير الـ Headers الأصلية لـ Node.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # منع السيرفر من الكشف عن إصداره في رسائل الخطأ
        proxy_hide_header X-Powered-By;
        
        # إعدادات التايم أوت
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 7. الحماية من طلبات الملفات المخفية وبعض الهجمات
    # --------------------------------------------------------------------------
    
    # منع الوصول لأي ملف يبدأ بنقطة (مثل .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # تعطيل عرض إصدار Nginx في صفحات الخطأ
    server_tokens off;
}

# ==============================================================================
# توجيه طلبات HTTP العادية إلى HTTPS
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # توجيه دائم (301) إلى HTTPS
    return 301 https://$host$request_uri;
}
